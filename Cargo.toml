[workspace]
resolver = "3"
members = ["common", "mock-iwd", "tray", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/bsd-source/iwdtray"
# gtk-rs 0.22 needs 1.92.
rust-version = "1.92"
publish = false

[workspace.dependencies]
# Both link dynamically against the system libraries; no async runtime needed.
glib-unix = "0.22"
gio = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# Wipes our own copies of secrets from memory when they are dropped.
zeroize = "1"
iwdtray-common = { path = "common" }
mock-iwd = { path = "mock-iwd" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
